:root{--g1:#0a4d33;--g2:#117a4d;--g3:#2fb36d;--au:#c9a227;--bg:#eef5f0;--card:#fff;--tx:#14261d;--mu:#5d7567;--bd:#d6e5db;--tint:#e5f1e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1913;--card:#14251c;--tx:#e8f2ea;--mu:#97ad9f;--bd:#254034;--tint:#1b3428}}
:root[data-theme="dark"]{--bg:#0d1913;--card:#14251c;--tx:#e8f2ea;--mu:#97ad9f;--bd:#254034;--tint:#1b3428}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font-family:Manrope,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
header{background:linear-gradient(120deg,#0a4d33,#117a4d 60%,#2fb36d);color:#fff;border-radius:26px;padding:22px 28px;display:flex;align-items:center;gap:28px;box-shadow:0 12px 32px rgba(10,77,51,.28);position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-70px;top:-70px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.07)}
header img{height:140px;width:auto;background:#fff;border-radius:22px;padding:12px 26px;flex:none;position:relative;z-index:1;box-shadow:0 10px 26px rgba(0,0,0,.25)}
header div{position:relative;z-index:1}header small{letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#cfe5d8;font-size:12px}
header h1{margin:6px 0 4px;font-family:Fraunces,Georgia,serif;font-size:36px;line-height:1.1}header p{margin:0;color:#d9efe2}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-top:16px}
.sb{display:grid;grid-template-columns:1fr auto auto auto;gap:10px}
input,select,button{font:inherit;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx)}
#q{font-size:16px;border-color:var(--g3);border-width:2px}button{cursor:pointer;font-weight:700}.b1{background:var(--g2);color:#fff;border:0}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--mu);font-size:14px;margin:14px 2px 0}
.it{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--g3);border-radius:18px;padding:16px 18px;margin-top:12px}
.it .n{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:700;color:var(--g1)}.it .d{color:var(--mu);font-size:13px}
.it h3{margin:0 0 4px;font-size:16px}.it p{margin:0;color:var(--mu);font-size:14px}
.bg{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;margin-top:6px}.ok{background:#d6f3e1;color:#0b5d3b}.wa{background:#fff0c2;color:#7a5a00}.in{background:#dfe9f5;color:#254a78}
a.ab{background:var(--tint);color:var(--g1);text-decoration:none;font-weight:700;padding:10px 14px;border-radius:12px;white-space:nowrap}
.vz{text-align:center;color:var(--mu);padding:30px}
footer{text-align:center;color:var(--mu);font-size:13px;padding:22px 0 8px}
@media (max-width:760px){header{flex-direction:column;align-items:flex-start;padding:18px}header img{height:100px}header h1{font-size:26px}.sb{grid-template-columns:1fr 1fr}#q{grid-column:1/-1}.it{grid-template-columns:1fr}.it .n{font-size:22px}}

.tabs{display:flex;gap:8px;margin-top:16px}.tabs button{background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:11px 22px;border-radius:14px}.tabs .on{background:var(--g2);color:#fff;border-color:var(--g2)}
h2{font-family:Fraunces,Georgia,serif;margin:0 0 12px;font-size:22px;color:var(--g1)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg label{display:grid;gap:4px;font-size:13px;color:var(--mu)}.fg input,.fg select{width:100%}
.bt{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.bt button{background:var(--tint);color:var(--g1);border:0}.bt .b1{background:var(--g2);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mu);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px;border-bottom:2px solid var(--au)}td{padding:9px 8px;border-bottom:1px solid var(--bd)}td button{padding:5px 10px;border-radius:10px;background:var(--tint);color:var(--g1);border:0;margin-right:4px}td .dg{background:#fbd9d4;color:#8a1f10}
.ox{overflow-x:auto}.pbx{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.er{color:#8a1f10;font-weight:700}textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
